[package]
name = "tclmesh-tfhe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "TFHE-rs backend for TclMesh private circuits, over a JSON-lines protocol"
publish = false

[lib]
name = "tclmesh_tfhe"
path = "src/lib.rs"

[[bin]]
name = "tclmesh-tfhe"
path = "src/main.rs"

[[bin]]
name = "tclmesh-tfhe-prove"
path = "src/bin/prove.rs"

[[bin]]
name = "tclmesh-tfhe-crs"
path = "src/bin/crs.rs"

[dependencies]
tfhe = { version = "=1.8.2", features = ["integer", "zk-pok"] }
serde = "1"
tfhe-zk-pok = "=0.9.0"
rand = "0.8"
rayon = "1"
serde_json = { version = "1", features = ["raw_value"] }
