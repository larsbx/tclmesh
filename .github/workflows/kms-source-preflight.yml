name: kms-source-preflight

# Source/version diagnostics only. This does NOT execute KMS, validate
# cryptographic shares, or establish a threshold confidentiality claim.
on:
  pull_request:
    paths:
      - 'tools/threshold_kms_preflight.py'
      - 'tests/test_threshold_kms_preflight.py'
      - 'docs/threshold-kms-preflight.md'
      - '.github/workflows/kms-source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance-only:
    name: KMS source diagnostic (NOT cryptographic acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # GitHub's default PR checkout is a synthetic merge commit, not the
          # original source revision whose evidence we intend to attribute.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Confirm exact TclMesh checkout provenance
        shell: bash
        env:
          EXPECTED_TCLMESH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TCLMESH_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Diagnose anonymous public GitHub source access
        shell: bash
        run: |
          # HTTP statuses are diagnostic only. Neither a 200 nor a 404 proves
          # anything about the existence/authenticity of the target Git object.
          set +e
          for item in \
            'https://github.com/zama-ai/kms.git/info/refs?service=git-upload-pack' \
            'https://api.github.com/repos/zama-ai/kms' \
            'https://api.github.com/repos/zama-ai/kms/commits/afcc7e5a48c31f7c3772b1799c8e856c8e3166f1'; do
            code=$(curl --location --silent --show-error --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "$item")
            printf 'Public source probe: %s => HTTP %s\\n' "$item" "$code"
          done

      - name: Fetch exact KMS source pin outside TclMesh checkout
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/kms-source"
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/zama-ai/kms.git
          if ! git -C "$source_dir" -c protocol.version=2 fetch -q --depth=1 --filter=blob:none origin afcc7e5a48c31f7c3772b1799c8e856c8e3166f1; then
            python3 - "$RUNNER_TEMP/kms-source-preflight.json" <<'PY'
          import json
          import sys

          report = {
              "status": "BLOCKED",
              "blockers": ["kms_source_unavailable"],
              "expected_kms_commit": "afcc7e5a48c31f7c3772b1799c8e856c8e3166f1",
              "note": "Exact upstream source fetch failed; no compatibility or security conclusion is possible.",
          }
          with open(sys.argv[1], "w", encoding="utf-8") as file:
              json.dump(report, file, sort_keys=True, indent=2)
          PY
            exit 1
          fi
          git -C "$source_dir" checkout --detach -q FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "afcc7e5a48c31f7c3772b1799c8e856c8e3166f1"
          test -f "$source_dir/Cargo.lock"
          test -f "$source_dir/core-client/config/client_local_threshold.toml"

      - name: Run preflight and require authentic machine-readable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/kms-source-preflight.json"
          set +e
          python3 tools/threshold_kms_preflight.py --kms-source "$RUNNER_TEMP/kms-source" > "$report"
          rc=$?
          set -e
          # Exit 2 means a confirmed compatibility/security blocker, not a
          # cryptographic pass. An unrecognized exit code is infrastructure failure.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          python3 - "$report" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["status"] in {"BLOCKED", "SOURCE_PREFLIGHT_ONLY"}
          assert "source_or_lockfile_unverifiable" not in report["blockers"], "source lockfile could not be inspected"
          assert report["kms"]["head"] == report["expected_kms_commit"], "wrong KMS revision"
          assert not report["kms"]["tracked_dirty"], "KMS checkout modified"
          assert not report["tclmesh"]["tracked_dirty"], "TclMesh checkout modified"
          assert report["kms"]["crates"]["tfhe"], "KMS TFHE version unreported"
          assert report["tclmesh"]["crates"]["tfhe"], "TclMesh TFHE version unreported"
          assert report["kms_config"] is not None, "KMS sample missing"
          print("Read-only KMS source evidence:", report["status"])
          print("Detected blockers:", ", ".join(report["blockers"]) or "none")
          print("NOT an acceptance test for threshold decryption or collusion security")
          PY

      - name: Attach non-secret source/version diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kms-source-preflight-only
          path: ${{ runner.temp }}/kms-source-preflight.json
          if-no-files-found: ignore
