name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tcltest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TCL
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tcllib
      - name: Verify failing tests propagate exit status
        run: |
          cat > tests/zz_exit_status_probe.test <<'EOF'
          package require Tcl 8.6
          package require tcltest 2
          namespace import ::tcltest::*
          test exit-status-probe {intentional failure must make runner nonzero} -body {
              return actual
          } -result expected
          cleanupTests
          EOF

          if tclsh tests/all.tcl; then
            echo "tests/all.tcl returned success despite an intentional failing test"
            rm -f tests/zz_exit_status_probe.test
            exit 1
          fi

          rm -f tests/zz_exit_status_probe.test
      - name: Run conformance smoke tests
        run: tclsh tests/all.tcl
      - name: Run release self-check
        run: tclsh tools/release_check.tcl

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TCL
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tcllib
      - name: Format and lint kernel
        run: |
          for m in kernel/Cargo.toml kernel/core/Cargo.toml; do
            cargo fmt --check --manifest-path "$m"
            cargo clippy --manifest-path "$m" --all-targets -- -D warnings
          done
          cargo test --manifest-path kernel/core/Cargo.toml
      - name: Kernel unit and committed-vector tests
        run: cargo test --manifest-path kernel/Cargo.toml
      - name: Recorded Tcl outcomes are current
        run: tclsh tools/conformance.tcl check
      - name: Install Lean (version pinned by spec/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build executable specification
        working-directory: spec
        run: lake build spec-eval
      - name: Kernel equals the specification on committed vectors
        run: |
          cargo build --release --manifest-path kernel/Cargo.toml
          spec/.lake/build/bin/spec-eval conformance/vectors.json > spec-outcomes.json
          kernel/target/release/tclmesh-kernel conform conformance/vectors.json spec-outcomes.json --exact
      - name: Random differential conformance (kernel = spec exactly; kernel refines Tcl)
        env:
          RUN_SEED: ${{ github.run_id }}
        run: |
          for spec in "1 2000 0" "2 2000 3" "3 2000 10" "$RUN_SEED 2000 2"; do
            set -- $spec
            echo "seed $1, $2 vectors, noise $3%"
            tclsh tools/conformance.tcl generate "$@" > vectors.json
            tclsh tools/conformance.tcl run vectors.json > outcomes.json
            spec/.lake/build/bin/spec-eval vectors.json > spec-outcomes.json
            kernel/target/release/tclmesh-kernel conform vectors.json spec-outcomes.json --exact
            kernel/target/release/tclmesh-kernel conform vectors.json outcomes.json --min-agreement 0.6
          done

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (version pinned by spec/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proofs
        working-directory: spec
        run: lake build
      - name: Audit axioms (no sorry, standard axioms only)
        working-directory: spec
        run: lake env lean Audit.lean

  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Translated model is current for kernel/core
        run: |
          sha256sum -c proof/CORE_SOURCE.sha256 || {
            echo "kernel/core changed: regenerate with proof/extract.sh and re-check the proofs"
            exit 1
          }
      - name: Install Lean (version pinned by proof/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib build cache
        working-directory: proof
        run: lake exe cache get
      - name: Check refinement proofs (Rust kernel-core = Lean spec)
        working-directory: proof
        run: lake build
      - name: Audit axioms (no sorry, standard axioms only)
        working-directory: proof
        run: lake env lean Audit.lean
