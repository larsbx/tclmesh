name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tcltest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TCL
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tcllib
      - name: Verify failing tests propagate exit status
        run: |
          cat > tests/zz_exit_status_probe.test <<'EOF'
          package require Tcl 8.6
          package require tcltest 2
          namespace import ::tcltest::*
          test exit-status-probe {intentional failure must make runner nonzero} -body {
              return actual
          } -result expected
          cleanupTests
          EOF

          if tclsh tests/all.tcl; then
            echo "tests/all.tcl returned success despite an intentional failing test"
            rm -f tests/zz_exit_status_probe.test
            exit 1
          fi

          rm -f tests/zz_exit_status_probe.test
      - name: Run conformance smoke tests
        run: tclsh tests/all.tcl
      - name: Threshold boundary mutants must be rejected
        run: python3 tools/check_threshold_boundary_mutants.py
      - name: Run release self-check
        run: tclsh tools/release_check.tcl

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TCL
        run: sudo apt-get update && sudo apt-get install -y tcl8.6 tcllib
      - name: Format and lint kernel
        run: |
          for m in kernel/Cargo.toml kernel/core/Cargo.toml; do
            cargo fmt --check --manifest-path "$m"
            cargo clippy --manifest-path "$m" --all-targets -- -D warnings
          done
          cargo test --manifest-path kernel/core/Cargo.toml
      - name: Kernel unit and committed-vector tests
        run: cargo test --manifest-path kernel/Cargo.toml
      - name: Recorded Tcl outcomes are current
        run: tclsh tools/conformance.tcl check
      - name: Install Lean (version pinned by spec/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build executable specification
        working-directory: spec
        run: lake build spec-eval
      - name: Kernel equals the specification on committed vectors
        run: |
          cargo build --release --manifest-path kernel/Cargo.toml
          spec/.lake/build/bin/spec-eval conformance/vectors.json > spec-outcomes.json
          kernel/target/release/tclmesh-kernel conform conformance/vectors.json spec-outcomes.json --exact
      - name: Per-party views (recorded = declared by Tcl and Lean; paired runs; calibration)
        run: |
          spec/.lake/build/bin/spec-eval --views conformance/circuits.json > spec-views.json
          tclsh tools/views.tcl check conformance/circuits.json spec-views.json
      - name: Certificates (Tcl checker = proved Lean checker; emitted = least; mutations rejected)
        run: |
          tclsh tools/views.tcl certificates conformance/circuits.json > certs.json
          spec/.lake/build/bin/spec-eval --certificates certs.json > spec-certs.json
          tclsh tools/views.tcl check-certificates certs.json spec-certs.json
      - name: Range certificates (Tcl checker = proved Lean checker; emitted = least; mutations rejected)
        run: |
          tclsh tools/views.tcl ranges conformance/circuits.json > ranges.json
          spec/.lake/build/bin/spec-eval --ranges ranges.json > spec-ranges.json
          tclsh tools/views.tcl check-ranges ranges.json spec-ranges.json
      - name: Clamp admission regressions (Tcl = Lean, including redundant out-of-word bounds)
        run: |
          tclsh tools/views.tcl ranges conformance/range_admission.json > admission-ranges.json
          spec/.lake/build/bin/spec-eval --ranges admission-ranges.json > spec-admission-ranges.json
          tclsh tools/views.tcl check-ranges admission-ranges.json spec-admission-ranges.json
      - name: Upstream word-range corpus (the Lean model replays the vendored finite-kernels corpus)
        run: spec/.lake/build/bin/spec-eval --word-range conformance/word_range_v1.txt
      - name: Random differential conformance (kernel = spec exactly; kernel refines Tcl)
        env:
          RUN_SEED: ${{ github.run_id }}
        run: |
          for spec in "1 2000 0" "2 2000 3" "3 2000 10" "$RUN_SEED 2000 2"; do
            set -- $spec
            echo "seed $1, $2 vectors, noise $3%"
            tclsh tools/conformance.tcl generate "$@" > vectors.json
            tclsh tools/conformance.tcl run vectors.json > outcomes.json
            spec/.lake/build/bin/spec-eval vectors.json > spec-outcomes.json
            kernel/target/release/tclmesh-kernel conform vectors.json spec-outcomes.json --exact
            kernel/target/release/tclmesh-kernel conform vectors.json outcomes.json --min-agreement 0.6
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format and lint
        run: |
          cargo fmt --check --manifest-path security/Cargo.toml
          cargo clippy --manifest-path security/Cargo.toml --all-targets -- -D warnings
      - name: Exact small models, zero-knowledge suite, calibrated battery
        run: cargo test --release --manifest-path security/Cargo.toml
      - name: Battery verdicts (every calibration break detected, sound scheme passes)
        run: cargo run --release --manifest-path security/Cargo.toml

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (version pinned by spec/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check proofs
        working-directory: spec
        run: lake build
      - name: Audit axioms (no sorry, standard axioms only)
        working-directory: spec
        run: lake env lean Audit.lean

  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Translated model is current for kernel/core
        run: |
          sha256sum -c proof/CORE_SOURCE.sha256 || {
            echo "kernel/core changed: regenerate with proof/extract.sh and re-check the proofs"
            exit 1
          }
      - name: Install Lean (version pinned by proof/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib build cache
        working-directory: proof
        run: lake exe cache get
      - name: Check refinement proofs (Rust kernel-core = Lean spec)
        working-directory: proof
        run: lake build
      - name: Audit axioms (no sorry, standard axioms only)
        working-directory: proof
        run: lake env lean Audit.lean

  upstream:
    # The vendored corpus is the file at the UPSTREAM.toml pin, which the
    # pinned finite-math-kernels toolchain regenerates and its Mojo kernel replays.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pin
        id: pin
        run: echo "commit=$(sed -n 's/^commit = "\(.*\)"$/\1/p' UPSTREAM.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: larsbx/finite-math-kernels
          ref: ${{ steps.pin.outputs.commit }}
          path: .cache/finite-math-kernels
          persist-credentials: false
      - name: Vendored files equal the pinned upstream files
        run: |
          test "$(git -C .cache/finite-math-kernels rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
          cmp conformance/word_range_v1.txt .cache/finite-math-kernels/conformance/word_range_v1.txt
          echo "$(sed -n 's/^sha256 = "\(.*\)"$/\1/p' UPSTREAM.toml)  conformance/word_range_v1.txt" | sha256sum -c
      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          manifest-path: .cache/finite-math-kernels/pixi.toml
      - name: Upstream reference regenerates the corpus; the canonical Mojo kernel replays it
        working-directory: .cache/finite-math-kernels
        run: |
          pixi run word-range-vectors
          pixi run test-word-range
