name: Q45 server testbanks (manual)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character commit SHA to check
        required: true
        type: string
      suite:
        description: Testbank suite
        required: true
        default: all
        type: choice
        options: [all, lean, quint]

permissions:
  contents: read

jobs:
  q45-testbanks:
    runs-on: [self-hosted, linux, x64, q45-formal]
    timeout-minutes: 60
    steps:
      - name: Require an exact source revision
        env:
          Q45_REVISION: ${{ inputs.revision }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[0-9a-fA-F]{40}', os.environ['Q45_REVISION']):
              raise SystemExit('revision must be an exact 40-character commit SHA')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      # The operator provisions the runtimes; dependency installation is explicit.
      - name: Install the locked Quint test dependency
        if: inputs.suite != 'lean'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix formal/quint
      - name: Execute the selected server testbank
        env:
          Q45_REVISION: ${{ inputs.revision }}
        run: |
          python3 -B tools/run_q45_testbanks.py run --revision "$Q45_REVISION" --suite '${{ inputs.suite }}' --out 'q45-server-results/${{ github.run_id }}-${{ github.run_attempt }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q45-server-testbanks-${{ github.run_id }}-${{ github.run_attempt }}
          path: q45-server-results
