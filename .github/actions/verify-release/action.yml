name: verify-release
description: Check VERSION against the tag, run the suite and the release self-check.

inputs:
  tag:
    description: Release tag, e.g. v0.2.0
    required: true
  path:
    description: Source tree to verify
    default: .

runs:
  using: composite
  steps:
    - name: Install TCL
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y tcl8.6 tcllib
    - name: Verify tag matches VERSION
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        TAG: ${{ inputs.tag }}
      run: |
        expected="v$(tr -d '\n\r ' < VERSION)"
        if [ "$TAG" != "$expected" ]; then
          echo "tag $TAG does not match VERSION ($expected)"
          exit 1
        fi
    - name: Run test suite
      shell: bash
      working-directory: ${{ inputs.path }}
      run: tclsh tests/all.tcl
    - name: Run release self-check
      shell: bash
      working-directory: ${{ inputs.path }}
      run: tclsh tools/release_check.tcl
